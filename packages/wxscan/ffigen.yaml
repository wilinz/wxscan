# Regenerate with: dart run ffigen --config ffigen.yaml
#
# src/wxscan.h is copied from the wxscan-rs repository, where cbindgen
# generates it from the wxscan-ffi crate. Keep the two in sync.
name: WxScanBindings
description: Generated bindings for the wxscan C ABI.
output: lib/src/bindings.dart
# Native-asset lookup: the symbols come from the code asset the build hook
# emits, so there is no DynamicLibrary to open and nothing to locate at run
# time. The id must match the asset name in hook/build.dart.
ffi-native:
  asset-id: 'package:wxscan/src/bindings.dart'
headers:
  entry-points:
    - src/wxscan.h
  include-directives:
    - src/wxscan.h
# cbindgen's `cpp_compat` emits both `enum WxScanStatus` and a `typedef int32_t`
# of the same name, which collide here. Dropping the typedef leaves the out
# parameter as a plain `Pointer<Int32>` and keeps the enum for its values.
typedefs:
  exclude:
    - WxScanStatus
preamble: |
  // Generated by package:ffigen from src/wxscan.h. Do not edit.
  // ignore_for_file: type=lint, unused_field, camel_case_types, non_constant_identifier_names
comments:
  style: any
  length: full
