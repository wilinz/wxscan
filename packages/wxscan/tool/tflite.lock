# Pinned TFLite C library artifacts, used by fetch_tflite.sh and .ps1.
#
# To upgrade, run: tool/update_tflite_lock.sh <litert-version> <desktop-version>
# which downloads each artifact and rewrites the checksums below.
#
# Any entry can be overridden from the environment with the same name, e.g.
#   LITERT_VERSION=2.3.0 LITERT_SHA256=... tool/fetch_tflite.sh android
#
# Android comes from Google Maven (com.google.ai.edge.litert:litert), the
# official distribution. There is no official desktop build, so those come from
# github.com/tphakala/tflite_c, which builds the TensorFlow sources in CI.

LITERT_VERSION=2.2.0
LITERT_SHA256=624518d72f8a249711a19e9901f480e74f823ca7818260a739cb2c023024807c

# The iOS framework, from the same release channel CocoaPods pulls from. The
# URL carries a build hash, so it is pinned whole rather than assembled from a
# version number.
IOS_VERSION=2.17.0
