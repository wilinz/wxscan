# Pinned TFLite C library archives, used by hook/tflite.dart.
#
# To upgrade, run: tool/update_tflite_lock.sh [tag]
# which downloads each archive and rewrites the checksums below.
#
# Everything comes from one release of one repository — one tag, nine archives,
# one TensorFlow version — built from the TensorFlow sources by that
# repository's build.sh in CI, so Android, iOS and the desktops link the same
# runtime. The tag names the TensorFlow version and that repository's build
# revision, because both decide the bytes.

