# Pinned so every machine and CI runner builds with the same compiler.
[toolchain]
channel = "1.95.0"
targets = [
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  # The Intel simulator slice, which a `flutter build ios --simulator` asks for
  # alongside the arm64 one so that the build runs on Intel Macs too.
  "x86_64-apple-ios",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
