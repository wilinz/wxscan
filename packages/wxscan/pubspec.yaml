name: wxscan
description: QR decoding for Dart and Flutter - a Rust port of the wechat_qrcode algorithm (CNN detection, super resolution, decoding). Images and raw pixel buffers; for a camera see wxscan_live.
version: 0.1.0
homepage: https://github.com/wilinz/wxscan
repository: https://github.com/wilinz/wxscan
issue_tracker: https://github.com/wilinz/wxscan/issues

# A plain Dart package, not a Flutter plugin: the native library is built and
# bundled by hook/build.dart, which works for `dart run` and `dart test` as well
# as for Flutter applications. That is why there are no android/, ios/, macos/,
# linux/ or windows/ build files here any more.
environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ffi: ^2.1.0
  # Used by the build hook.
  hooks: ^2.2.0
  code_assets: ^1.2.1
  native_toolchain_rust: ^1.0.6
  archive: ^4.0.0
  crypto: ^3.0.0

dev_dependencies:
  ffigen: ^19.1.0
  lints: ^6.0.0
  test: ^1.25.0
