// wxscan: CameraX frames go through JNI straight into the Rust scanner. The
// preview is a CameraX Preview bound to a Flutter SurfaceTexture.
//
// Nothing native is built here. The scanner is a Dart code asset, produced by
// the wxscan_core package's build hook; Flutter puts it in the APK's
// lib/<abi>/, which is exactly where System.loadLibrary looks, so the JNI
// entry point in NativeScanner finds it with no build of its own.
group 'com.wilinz.wxscan'
version '0.1.0'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories { google(); mavenCentral() }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.wilinz.wxscan'
    }
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        minSdk 24

        // LiteRT publishes arm64-v8a, armeabi-v7a and x86_64 only. An
        // application that also builds 32-bit x86 gets no scanner for that ABI,
        // so it should exclude it.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.lifecycle:lifecycle-common:2.8.4"
}
