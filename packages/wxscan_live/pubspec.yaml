name: wxscan_live
description: Live QR scanning. Camera frames go straight into a Rust port of the wechat_qrcode algorithm without passing through Dart; the preview is a Flutter texture. CameraX on Android, AVFoundation on Apple platforms.
version: 0.1.0
homepage: https://github.com/wilinz/wxscan
repository: https://github.com/wilinz/wxscan
issue_tracker: https://github.com/wilinz/wxscan/issues

# As for wxscan, with camera in place of image: this is the live path.
topics:
  - qr-code
  - barcode
  - scanner
  - camera
  - ffi

environment:
  sdk: ">=3.10.0 <4.0.0"
  # Not the plugin template's 3.19. The floor is the build hook that produces
  # the native library: hooks and code_assets both want Dart 3.10, and 3.38.1
  # is the first stable Flutter that ships it as a release rather than a beta
  # build. Below this the package does not build at all.
  #
  # Android wants 3.44, for a rotation bug the README explains. That one is a
  # recommendation and not this constraint: everything but rotation works below
  # it, and holding back callers on other platforms for an Android engine bug
  # is not this package's call to make.
  flutter: ">=3.38.1"

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  # Provides the native library, as a code asset, and the result types shared
  # with the image-decoding path. Hosted rather than a path, because pub refuses
  # to publish a package that depends on one; dependency_overrides below points
  # it back at this checkout for development.
  wxscan: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wilinz.wxscanlive
        pluginClass: WxScanLivePlugin
      ios:
        pluginClass: WxScanLivePlugin
      macos:
        pluginClass: WxScanLivePlugin
      web:
        pluginClass: WxScanWeb
        fileName: src/web/platform_web.dart

# Development only; anything depending on this package ignores it. Without it
# the hosted constraint above would send pub looking on pub.dev for a package
# that lives next door.
dependency_overrides:
  wxscan:
    path: ../wxscan
