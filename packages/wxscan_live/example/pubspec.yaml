name: wxscan_example
description: "Demo for the wxscan_live plugin: live scanning, image decoding, and the multi-code picker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.1
  image_picker: ^1.1.2
  # Opening a decoded link, and the addresses on the about screen.
  url_launcher: ^6.3.0
  image: ^4.2.0
  wxscan_live:
    path: ../
  wxscan:
    path: ../../wxscan

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Directories rather than the files themselves, because two of those files
    # are not in the package published to pub.dev — the weights, and the
    # photograph. A named asset that is not there fails the build; a directory
    # takes what it finds, so a copy from pub.dev builds and runs, and says on
    # the home screen that the weights are missing. See assets/models/README.md.
    #
    # Weights: detect.tflite and sr.tflite, from github.com/wilinz/wxscan-weights.
    - assets/models/
    # Sample images for the startup self-test and the on-device tests.
    - assets/test/

# The example builds against this checkout, not against pub.dev. wxscan depends
# on wxscan by a hosted constraint so that it can be published, and this
# points both back here.
dependency_overrides:
  wxscan_live:
    path: ../
  wxscan:
    path: ../../wxscan
