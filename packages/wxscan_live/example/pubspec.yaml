name: wxscan_example
description: "Demo for the wxscan_live plugin: live scanning, image decoding, and the multi-code picker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.1
  image_picker: ^1.1.2
  # Opening a decoded link, and the addresses on the about screen.
  url_launcher: ^6.3.0
  image: ^4.2.0
  wxscan_live:
    path: ../
  wxscan:
    path: ../../wxscan

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Prebuilt weights from github.com/wilinz/wxscan-weights, which also holds
    # the scripts that convert them from the published Caffe models.
    - assets/models/detect.tflite
    - assets/models/sr.tflite
    # Sample images for the startup self-test and the on-device tests.
    - assets/test/qr_sample.png
    - assets/test/qr_clean.png
    - assets/test/qr_photo.jpg

# The example builds against this checkout, not against pub.dev. wxscan depends
# on wxscan by a hosted constraint so that it can be published, and this
# points both back here.
dependency_overrides:
  wxscan_live:
    path: ../
  wxscan:
    path: ../../wxscan
