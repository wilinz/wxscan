org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Keeps the Flutter Gradle plugin's hands off `ndk { abiFilters }`. Without
# this, configureAbiWithoutSplits clears whatever the app sets and puts back
# arm64-v8a, armeabi-v7a and x86_64, so an ABI list in build.gradle.kts reads
# as if it decides something and does not. With it, the list in defaultConfig
# is the one that counts.
disable-abi-filtering=true
