# Builds the example for the browser and publishes it as the live demo at
# https://wilinz.github.io/wxscan/.
#
# Nothing native is compiled for the host here. A web build asks the Dart build
# hooks for no code assets, so they return without touching Rust or
# libtensorflowlite_c. The weights are committed in the example; of the four
# browser artifacts one comes from wxscan, one is built below, and two are
# fetched from the release wxscan pins.
name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wxscan_live/example
    steps:
      - uses: actions/checkout@v4

      # The scanner's WebAssembly is built here because there is nowhere else
      # to get it: the package does not carry one. It used to, and a compiled
      # artifact sitting beside the sources it came from went out of step with
      # them — the demo served a detector bug for a while after Rust had been
      # fixed, because rebuilding it was a step someone had to remember.
      #
      # cvlite and wxing are not on crates.io yet, so they are checked out
      # beside wxscan-rs and patched in exactly as wxscan-dev/link.sh does on a
      # developer's machine — the same wiring, so CI builds what they build.
      # The toolchain comes from wxscan-rs's rust-toolchain.toml, so it is the
      # same compiler too.
      - uses: actions/checkout@v4
        with: { repository: wilinz/wxscan-rs, path: _rust/wxscan-rs }
      - uses: actions/checkout@v4
        with: { repository: wilinz/cvlite, path: _rust/cvlite }
      - uses: actions/checkout@v4
        with: { repository: wilinz/wxing, path: _rust/wxing }

      - name: Build the scanner for the browser
        working-directory: ${{ github.workspace }}/_rust/wxscan-rs
        run: |
          mkdir -p .cargo
          printf '[patch.crates-io]\ncvlite = { path = "../cvlite" }\nwxing = { path = "../wxing" }\n' > .cargo/config.toml
          rustup target add wasm32-unknown-unknown
          # Costs nothing in correctness and takes about 28% off scanning time.
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build -p wxscan-wasm --target wasm32-unknown-unknown --profile wasm

      # Pinned, and not below 3.44: earlier engines show a white screen on
      # rotation in a browser, which there is no working around from Dart.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable

      - run: flutter pub get

      # The browser's TFLite runtime comes from a release of its own, so it is
      # the one thing here that can be left behind when the pinned TensorFlow
      # version moves, with nothing visible at run time to say so. See
      # packages/wxscan/doc/web_build.md.
      - name: Check the browser TFLite runtime against the pin
        working-directory: packages/wxscan
        run: tool/check_tflite_web.sh

      # What `dart run wxscan:fetch_web --from ...` does, done directly.
      #
      # Not the command itself: running any Dart program builds the package's
      # code assets first, which means cargo for the *host* — several minutes
      # of Rust that a web build has no use for, against path dependencies on
      # checkouts laid out as siblings of the repository, which these are not.
      # So the four files are assembled here, from the same three places
      # fetch_web takes them from, and web.lock stays the only thing that says
      # which release and which bytes.
      #
      # The scanner is the one built above rather than the released one: this
      # demo follows main, which is the whole point of it. The runtime is
      # fetched, because building it is an emsdk and ten minutes and it moves
      # only when the pinned TensorFlow version does.
      #
      # The checksums are verified for the same reason fetch_web verifies them:
      # a release asset can be replaced, and a page built from whatever a URL
      # served would be pinning nothing.
      - name: Place the browser artifacts
        run: |
          lock=../../wxscan/tool/web.lock
          value() { grep "^$1=" "$lock" | head -1 | cut -d= -f2-; }
          repo=$(value TFLITE_REPO)
          tag=$(value TFLITE_TAG)

          mkdir -p web/wxscan
          cp ../../wxscan/lib/src/web/assets/wxscan_worker.js web/wxscan/
          cp "${{ github.workspace }}/_rust/wxscan-rs/target/wasm32-unknown-unknown/wasm/wxscan_wasm.wasm" \
             web/wxscan/
          for f in wxscan_tflite.js wxscan_tflite.wasm; do
            curl -fsSL "https://github.com/$repo/releases/download/$tag/$f" -o "web/wxscan/$f"
          done

          echo "$(value TFLITE_JS_SHA256)  web/wxscan/wxscan_tflite.js" | sha256sum -c -
          echo "$(value TFLITE_WASM_SHA256)  web/wxscan/wxscan_tflite.wasm" | sha256sum -c -

          # A build that quietly produced nothing cannot reach the page.
          test "$(ls web/wxscan | wc -l)" -eq 4
          ls -l web/wxscan

      # A project page is served from a subdirectory, and every URL the built
      # application asks for is relative to this. Without it the page loads and
      # nothing else does.
      - name: Build
        run: flutter build web --release --base-href /wxscan/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/wxscan_live/example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
