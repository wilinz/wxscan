# Builds the example for the browser and publishes it as the live demo at
# https://wilinz.github.io/wxscan/.
#
# Nothing native is compiled here. A web build asks the Dart build hooks for no
# code assets, so they return without touching Rust or libtensorflowlite_c; the
# four browser artifacts are the ones committed inside wxscan, placed by
# `fetch_web`, and the weights are committed in the example.
name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wxscan_live/example
    steps:
      - uses: actions/checkout@v4

      # The scanner's own WebAssembly is built here from the Rust sources
      # rather than taken from the copy committed in the package. That copy is
      # for people installing from pub.dev, who have no Rust toolchain — and it
      # is a file that can fall behind the sources it came from, which it did:
      # the demo served a detector bug for a while after Rust had been fixed.
      # A build takes seconds and cannot be out of step with anything.
      #
      # cvlite and wxing are not on crates.io yet, so they are checked out
      # beside wxscan-rs and patched in exactly as wxscan-dev/link.sh does on a
      # developer's machine — the same wiring, so CI builds what they build.
      - uses: actions/checkout@v4
        with: { repository: wilinz/wxscan-rs, path: _rust/wxscan-rs }
      - uses: actions/checkout@v4
        with: { repository: wilinz/cvlite, path: _rust/cvlite }
      - uses: actions/checkout@v4
        with: { repository: wilinz/wxing, path: _rust/wxing }

      - name: Build the scanner for the browser
        working-directory: ${{ github.workspace }}/_rust/wxscan-rs
        run: |
          mkdir -p .cargo
          printf '[patch.crates-io]\ncvlite = { path = "../cvlite" }\nwxing = { path = "../wxing" }\n' > .cargo/config.toml
          rustup target add wasm32-unknown-unknown
          # Costs nothing in correctness and takes about 28% off scanning time.
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build -p wxscan-wasm --target wasm32-unknown-unknown --profile wasm

      # Pinned, and not below 3.44: earlier engines show a white screen on
      # rotation in a browser, which there is no working around from Dart.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable

      - run: flutter pub get

      # The browser artifacts are not Flutter assets — see fetch_web's own
      # documentation for why — so they are copied into web/ before the build.
      #
      # Copied here rather than by `dart run wxscan:fetch_web`, which is what a
      # reader is told to run. Running a Dart program builds the package's code
      # assets first, and that means cargo, for the host, against path
      # dependencies on sibling checkouts this runner does not have — several
      # minutes of Rust for a web build that wants none of it. The command only
      # copies these files, so the copy is done directly.
      #
      # The whole directory, not a list: a fifth artifact should arrive here
      # without anyone remembering to add it, and the check below is what says
      # so if the path ever moves.
      - name: Place the browser artifacts
        run: |
          mkdir -p web/wxscan
          cp ../../wxscan/lib/src/web/assets/* web/wxscan/
          test "$(ls web/wxscan | wc -l)" -ge 4
          # The one that was just built wins over the committed copy. The
          # TFLite runtime beside it is not built here: emscripten, a clone of
          # TensorFlow and a thousand XNNPACK microkernels, a quarter of an
          # hour at best, and it moves only when the pinned TFLite version
          # does. That pair stays as committed.
          cp "${{ github.workspace }}/_rust/wxscan-rs/target/wasm32-unknown-unknown/wasm/wxscan_wasm.wasm" \
             web/wxscan/wxscan_wasm.wasm
          ls -l web/wxscan

      # A project page is served from a subdirectory, and every URL the built
      # application asks for is relative to this. Without it the page loads and
      # nothing else does.
      - name: Build
        run: flutter build web --release --base-href /wxscan/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/wxscan_live/example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
